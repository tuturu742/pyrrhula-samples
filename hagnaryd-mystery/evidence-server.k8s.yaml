# The Hägnaryd forensic lab, run inside the cluster -- for deployments where pods
# cannot reach a process on the host by name (any Kubernetes install).
#
#   kubectl -n pyrrhula create configmap evidence-server --from-file=evidence-server.py
#   kubectl apply -f evidence-server.k8s.yaml
#
# then register it in the UI (World / Campaigns -> the workspace where you imported
# the bundle -> Settings -> MCP servers -> Register):
#
#   key            evidence
#   url            http://evidence-lab:8765
#   enabled tools  evidence_check
#   calls/session  2
#
# The two-request budget is NOT kept here: the server keeps no count. Pyrrhula enforces
# it per session (calls/session above), so one pod serves any number of games and there
# is nothing to restart between them.
apiVersion: v1
kind: Service
metadata:
  namespace: pyrrhula
  name: evidence-lab
spec:
  selector:
    app: evidence-lab
  ports:
    - port: 8765
      targetPort: 8765
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: pyrrhula
  name: evidence-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evidence-lab
  template:
    metadata:
      labels:
        app: evidence-lab
    spec:
      containers:
        - name: lab
          image: docker.io/library/python:3.12-alpine
          command: ["python3", "/app/evidence-server.py", "--port", "8765"]
          ports:
            - containerPort: 8765
          volumeMounts:
            - name: script
              mountPath: /app
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: evidence-server
